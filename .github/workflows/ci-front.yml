name: CI Front

# Ne se déclenche que si le front a bougé : les sessions purement Python
# (entraînement, API, DVC) n'ont aucune raison de payer une installation npm.
on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (et non `npm install`) : il installe EXACTEMENT ce que dit
      # package-lock.json et échoue si le lock est désynchronisé — ce qui
      # évite qu'une version différente passe en CI et casse en production.
      - name: Install dependencies
        run: npm ci

      # Le compilateur TypeScript en mode strict est notre garde-fou
      # principal : les types de `core/api/api.types.ts` reflètent l'API
      # FastAPI, donc un champ oublié fait échouer la compilation.
      - name: Build (mode production, budgets appliqués)
        run: npm run build

      - name: Unit tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadless
