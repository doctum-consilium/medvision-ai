# CI principale — lint + tests sur chaque push et PR.
#
# 3 jobs indépendants :
#   lint      : ruff (src/ + tests/) + shellcheck (scripts maintenus). Rapide.
#   test-fast : pytest smoke sans TF (~5 s). Gate principal de PR.
#   test-tf   : pytest complet avec TF (~60 s). Tourne sur push/PR main.
#
# Règle diff-cover (inspirée doctum-trading-platform) :
#   Toute ligne MODIFIÉE ou AJOUTÉE par une PR doit être couverte à ≥ 80 %.
#   Ça interdit de merger du code métier sans tests.
#
# Les tests TF ne tournent pas en pre-push local (trop lents) mais bloquent
# les PR sur main — c'est voulu : on valide localement en smoke, on bloque
# en CI si les vrais modèles ou la FastAPI cassent.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Job 1 : Lint ─────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint (Ruff + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install --upgrade pip ruff==0.9.10

      - name: Ruff (src/ + tests/)
        run: ruff check src/ tests/

      - name: shellcheck (scripts maintenus)
        run: |
          sudo apt-get install -y shellcheck -qq
          shellcheck -x \
            .githooks/_lib.sh \
            .githooks/pre-commit \
            .githooks/pre-push \
            scripts/ci_local.sh \
            docker/entrypoint.sh

# ─── Job 2 : Tests smoke sans TF (gate principal de PR) ──────────────────
  test-fast:
    name: Tests smoke (sans TF)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover a besoin de l'historique complet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/ci-fast.txt

      - name: Dépendances légères
        run: |
          pip install --upgrade pip
          pip install -r requirements/ci-fast.txt
          pip install pytest-cov==6.0.0 diff-cover==9.2.0

      - name: Tests smoke + couverture
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/smoke/ \
            --cov=src \
            --cov-report=xml:coverage-smoke.xml \
            --cov-report=term-missing \
            -q

      - name: Couverture du diff ≥ 80 %
        # Règle : tout code AJOUTÉ ou MODIFIÉ par la PR doit être couvert.
        # Seuil 80 % (pas 100 %) : la logique métier doit être testée,
        # mais les couches d'orchestration CLI ne le sont pas toujours.
        # Ne PAS baisser ce seuil — remonter les tests à la place.
        #
        # --exclude '*/models/*' : les définitions d'architectures (src/models et
        # src/segmentation/models — les deux seuls dossiers « models » du dépôt) importent
        # TensorFlow au niveau module ; elles ne peuvent PAS tourner dans cette suite smoke
        # volontairement sans TF, donc --cov=src les compte à 0 %. Leur couverture est assurée
        # par le job test-tf (tests/test_model_builders.py). On les sort donc de CE gate-ci
        # pour ne pas exiger l'impossible sans rabaisser le seuil global. Le motif '*/models/*'
        # est requis car diff-cover préfixe les chemins ('src/models/*' ne matche pas).
        #
        # --ignore-staged --ignore-unstaged : ne juger QUE le code commité (origin/main...HEAD).
        # Sans ces flags, diff-cover inclut « staged and unstaged changes » du working tree du
        # runner. Or .gitattributes impose eol=lf alors que des fichiers historiques sont encore
        # en CRLF : au checkout, git les voit comme modifiés (EOL) et diff-cover les ramassait
        # comme lignes ajoutées non couvertes (src/segmentation/data.py, streamlit_app.py…),
        # faisant échouer le gate sur du code que la PR ne touche pas.
        run: |
          diff-cover coverage-smoke.xml \
            --compare-branch=origin/main \
            --fail-under=80 \
            --exclude '*/models/*' \
            --ignore-staged --ignore-unstaged

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-smoke
          path: coverage-smoke.xml
          if-no-files-found: ignore

# ─── Job 3 : Tests complets avec TF (push + PR main uniquement) ──────────
  test-tf:
    name: Tests complets (avec TF)
    runs-on: ubuntu-latest
    needs: lint
    # TF est lourd : on le joue seulement sur main/master pour ne pas ralentir
    # les branches feature. Ajuster si besoin.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.base_ref == 'main' || github.base_ref == 'master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/requirements-ci.txt

      - name: Dépendances complètes (avec TF)
        run: |
          pip install --upgrade pip
          pip install -r requirements/requirements-ci.txt
          pip install pytest-cov==6.0.0 diff-cover==9.2.0

      - name: Tous les tests + couverture
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage-tf.xml \
            --cov-report=term-missing \
            -q

      - name: Couverture du diff ≥ 80 %
        # --ignore-staged --ignore-unstaged : ne juger QUE le code commité (origin/main...HEAD),
        # pour ne pas ramasser les différences EOL du working tree du runner (cf. job test-fast).
        run: |
          diff-cover coverage-tf.xml \
            --compare-branch=origin/main \
            --fail-under=80 \
            --ignore-staged --ignore-unstaged

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tf
          path: coverage-tf.xml
          if-no-files-found: ignore
