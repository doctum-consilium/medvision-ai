<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!--
    Icône d'onglet : le même iris que la marque de l'en-tête, sur fond plein
    pour rester lisible à 16 px. Les couleurs sont figées ici (un favicon
    n'hérite d'aucune variable CSS) et choisies pour tenir sur les onglets
    clairs comme sombres.
  -->
  <rect width="40" height="40" rx="9" fill="#0b5548"/>
  <circle cx="20" cy="20" r="13.5" fill="none" stroke="#7ed6bd" stroke-width="2.6"/>
  <circle cx="20" cy="20" r="7" fill="#2f9c85"/>
  <circle cx="20" cy="20" r="2.6" fill="#eafaf4"/>
  <path d="M3.5 20h4M32.5 20h4M20 3.5v4M20 32.5v4"
        stroke="#7ed6bd" stroke-width="2.6" stroke-linecap="round"/>
</svg>
