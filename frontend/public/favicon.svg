<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Icône d'onglet : le signe ◍ — un anneau et un disque plein au centre.
    Dessiné plutôt qu'emprunté à une police, car un glyphe change d'aspect
    d'un système à l'autre et ne se rend pas dans un favicon.

    Les couleurs sont figées : un favicon n'hérite d'aucune variable CSS.
    Elles sont choisies pour rester lisibles sur un onglet clair comme
    sombre, et le fond arrondi garantit le contraste dans les deux cas.

    Aucun détail fin : à 16 px, tout ce qui est plus mince que deux pixels
    disparaît. D'où l'anneau épais et le disque large.
  -->
  <rect width="64" height="64" rx="14" fill="#0b5548"/>
  <circle cx="32" cy="32" r="22.1" fill="none" stroke="#7ed6bd" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="8.6" fill="#7ed6bd"/>
</svg>
